name: Build MAHMOUD VPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name 'MAHMOUD-VPN-files-corrected*.zip' -print -quit)
          test -n "$ZIP_FILE"
          unzip -o "$ZIP_FILE" -d . -x '.github/workflows/*'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAHMOUD-VPN-APK
          path: app/build/outputs/apk/debug/*.apk
